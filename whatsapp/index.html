<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Escríbele a Del Mar · PETRA</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#F8F8FB;color:#111318;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:16px 18px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid #E9EAF0;border-radius:24px;padding:28px 22px 22px;text-align:left}
.foto{width:120px;height:120px;border-radius:50%;display:block;margin:0 auto 20px}
.op{padding:16px 0;border-top:1px solid #E9EAF0}
.op:first-of-type{border-top:0;padding-top:0}
.op-t{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:16px;line-height:1.45;color:#111318}
.op-t:last-child{margin-bottom:0}
.n{flex:0 0 26px;height:26px;border-radius:50%;background:#111318;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.sin-num .n{display:none}
.sin-num #op1 .op-t{display:none}
.wa{-webkit-touch-callout:default;display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;text-decoration:none;border-radius:999px;padding:16px 12px;font-size:18px;font-weight:700}
.wa:active{transform:scale(.98)}
.wa svg{width:24px;height:24px;fill:#fff}
.num{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#F8F8FB;border:1px solid #E9EAF0;border-radius:14px;padding:12px 14px;font-size:17px;font-weight:600;color:#111318;white-space:nowrap}
.copy{border:1px solid #D5D7E0;background:#fff;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:400;color:#111318;cursor:pointer}
.contacto{display:block;margin:10px 0 0;padding:12px;border:1px solid #D5D7E0;border-radius:999px;color:#111318;text-decoration:none;font-size:16px;font-weight:600;text-align:center}
.resalta{background:#FFF4E5;border-radius:12px;padding:10px 12px;margin-left:-12px;margin-right:-12px}
</style>
</head>
<body>
<main class="card" id="card">
  <img class="foto" src="/img/delmar.jpg" alt="Del Mar, de Petra" width="120" height="120">

  <section class="op" id="op1">
    <p class="op-t"><span class="n">1</span><span id="op1-texto">Escríbeme por WhatsApp:</span></p>
    <a class="wa" id="wa" href="https://wa.me/573181419767?text=Hola%20Del%20Mar%2C%20quiero%20entender%20c%C3%B3mo%20funciona%20Petra.%20Mi%20nombre%20es%3A%20">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1c-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.2-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4C2.7 15.6 2.2 13.8 2.2 12 2.2 6.6 6.6 2.2 12 2.2S21.8 6.6 21.8 12 17.4 21.8 12 21.8zM12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.8 1 3.8 1.5 5.8 1.5 6.6 0 12-5.4 12-12S18.6 0 12 0z"/></svg>
      <span id="walabel">Escríbeme por WhatsApp</span>
    </a>
  </section>

  <section class="op" id="op2" hidden>
    <p class="op-t"><span class="n">2</span><span id="op2-texto">¿No te sale «Abrir enlace»? Toca los tres puntos <b>⋯</b> arriba y elige <b>«Abrir en navegador»</b>.</span></p>
  </section>

  <section class="op" id="op3">
    <p class="op-t"><span class="n" id="op3-n">3</span><span id="op3-texto">O escríbeme directo a mi WhatsApp:</span></p>
    <div class="num">
      <span>WhatsApp 318 141 9767</span>
      <button class="copy" id="copy" type="button">Copiar</button>
    </div>
    <a class="contacto" id="contacto" href="/delmar.vcf" download="Del Mar Petra.vcf" hidden>Guardar mi contacto</a>
  </section>
</main>
<script>
(function(){
  var ua=navigator.userAgent||'';
  var inApp=/musical_ly|BytedanceWebview|TikTok|trill|Instagram|FBAN|FBAV|FB_IAB/i.test(ua);
  var card=document.getElementById('card');
  if(!inApp){
    // Navegador normal: el botón funciona con un toque. Solo dos opciones, sin números.
    card.classList.add('sin-num');
    return;
  }
  var android=/Android/i.test(ua);
  var op1=document.getElementById('op1-texto');
  var op2=document.getElementById('op2');
  var op3=document.getElementById('op3-texto');
  if(android){
    // En Android dentro de TikTok/Instagram el botón no abre WhatsApp: primero hay que salir al navegador.
    // Sin botón: aquí la persona lo toca y no pasa nada. Primero tiene que salir al navegador.
    op1.innerHTML='Toca los tres puntos <b>⋯</b> arriba a la derecha y elige <b>«Abrir en navegador»</b>.';
    document.getElementById('wa').hidden=true;
    document.getElementById('op3-n').textContent='2';
    op3.textContent='O escríbeme directo a mi WhatsApp:';
  }else{
    op1.innerHTML='<b>Mantén presionado</b> el botón verde y elige <b>«Abrir enlace»</b>.';
    document.getElementById('walabel').textContent='Mantén presionado aquí';
    op2.hidden=false;
    op3.textContent='Escríbeme directo a mi WhatsApp:';
    document.getElementById('wa').addEventListener('click',function(e){
      e.preventDefault();
      var t=document.getElementById('op1').querySelector('.op-t');
      t.classList.add('resalta');
      t.scrollIntoView({behavior:'smooth',block:'center'});
    });
  }
})();
</script>
<script>
document.getElementById('copy').addEventListener('click',function(){
  var b=this,t='3181419767';
  function ok(){b.textContent='Copiado';setTimeout(function(){b.textContent='Copiar'},2000)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else{fb()}
  function fb(){var i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(i)}
});
</script>
</body>
</html>
